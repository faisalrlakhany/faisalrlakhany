<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles - left side -->
  <circle cx="100" cy="100" r="80" fill="#3b82f6" opacity="0.1"/>
  <circle cx="150" cy="150" r="60" fill="#06b6d4" opacity="0.15"/>
  
  <!-- Decorative circles - right side -->
  <circle cx="1180" cy="500" r="90" fill="#3b82f6" opacity="0.1"/>
  <circle cx="1220" cy="580" r="70" fill="#06b6d4" opacity="0.15"/>
  
  <!-- Code brackets decoration -->
  <text x="80" y="550" font-size="80" font-family="'Courier New', monospace" fill="#3b82f6" opacity="0.3" font-weight="bold">&lt;</text>
  <text x="1120" y="550" font-size="80" font-family="'Courier New', monospace" fill="#06b6d4" opacity="0.3" font-weight="bold">/&gt;</text>
  
  <!-- Main Title -->
  <text x="640" y="220" font-size="72" font-family="Arial, sans-serif" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">
    Muhammad Faisal Lakhany
  </text>
  
  <!-- Accent line -->
  <line x1="250" y1="260" x2="1030" y2="260" stroke="url(#accentGradient)" stroke-width="4" opacity="0.8"/>
  
  <!-- Subtitle -->
  <text x="640" y="330" font-size="36" font-family="Arial, sans-serif" fill="#06b6d4" text-anchor="middle" font-weight="600">
    Front-End &amp; React Developer
  </text>
  
  <!-- Description -->
  <text x="640" y="390" font-size="20" font-family="Arial, sans-serif" fill="#e5e7eb" text-anchor="middle">
    Building responsive, scalable web applications with React &amp; Modern JavaScript
  </text>
  
  <!-- Tech badges -->
  <g>
    <!-- React badge -->
    <rect x="350" y="450" width="140" height="50" rx="8" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    <text x="420" y="485" font-size="16" font-family="Arial, sans-serif" fill="#60a5fa" text-anchor="middle" font-weight="600">⚛️ React</text>
    
    <!-- JavaScript badge -->
    <rect x="530" y="450" width="140" height="50" rx="8" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="2"/>
    <text x="600" y="485" font-size="16" font-family="Arial, sans-serif" fill="#22d3ee" text-anchor="middle" font-weight="600">JS/TS</text>
    
    <!-- Firebase badge -->
    <rect x="710" y="450" width="140" height="50" rx="8" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
    <text x="780" y="485" font-size="16" font-family="Arial, sans-serif" fill="#60a5fa" text-anchor="middle" font-weight="600">🔥 Firebase</text>
    
    <!-- TailwindCSS badge -->
    <rect x="890" y="450" width="140" height="50" rx="8" fill="#06b6d4" opacity="0.2" stroke="#06b6d4" stroke-width="2"/>
    <text x="960" y="485" font-size="16" font-family="Arial, sans-serif" fill="#22d3ee" text-anchor="middle" font-weight="600">Tailwind</text>
  </g>
  
  <!-- Contact info -->
  <text x="640" y="580" font-size="16" font-family="Arial, sans-serif" fill="#9ca3af" text-anchor="middle">
    📍 Karachi, Pakistan | 📧 faisallakhany707@gmail.com | 💻 github.com/faisalrlakhany
  </text>
</svg>